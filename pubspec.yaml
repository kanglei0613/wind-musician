name: wind_musician
description: "管樂人練習工具 App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 狀態管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.0.0

  # 圖示
  cupertino_icons: ^1.0.8

  # HTTP 請求（呼叫後端 API）
  http: ^1.6.0

  # 多語言（中文、日文、英文）
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  pitch_detector_dart: ^0.0.7
  record: ^6.2.0
  buffered_list_stream: ^1.3.0
  just_audio: ^0.10.5
  share_plus: ^10.0.2
  uuid: ^4.5.1
  path_provider: ^2.1.4 
  flutter_soloud: ^3.5.4
  flutter_dotenv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/data/music_terms_en.json
    - assets/data/music_terms_zh.json
    - assets/data/music_terms_ja.json
    - assets/data/music_terms_ko.json