name: wind_musician
description: "管樂人練習工具 App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 狀態管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.0.0

  # 圖示
  cupertino_icons: ^1.0.8

  # HTTP 請求（呼叫後端 API）
  http: ^1.6.0

  # 多語言（中文、日文、英文）
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 啟用多語言自動產生
  generate: true
  uses-material-design: true
  