name: wind_musician
description: "管樂人練習工具 App"
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 狀態管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.0.0

  # 圖示
  cupertino_icons: ^1.0.8

  # HTTP 請求（呼叫後端 API）
  http: ^1.6.0

  # 多語言（中文、日文、英文）
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  permission_handler: ^12.0.1
  pitch_detector_dart: ^0.0.7
  record: ^6.2.0
  buffered_list_stream: ^1.3.0
  just_audio: ^0.10.5
  share_plus: ^10.0.2
  uuid: ^4.5.1
  path_provider: ^2.1.4 
  flutter_soloud: ^3.5.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_crashlytics: ^4.1.3
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.4.4
  sign_in_with_apple: ^6.1.2

  # 行事曆
  table_calendar: ^3.1.2

  # 圖表（分析頁面）
  fl_chart: ^0.69.0

  # 檔案選擇（分析上傳）
  file_picker: ^8.1.2

  # App 版本
  package_info_plus: ^8.0.0

  # 裝置資訊（Feedback 頁面偵測型號 / OS）
  device_info_plus: ^10.1.0

  # 外部連結
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/music_terms_en.json
    - assets/data/music_terms_zh.json
    - assets/data/music_terms_ja.json
    - assets/data/music_terms_ko.json